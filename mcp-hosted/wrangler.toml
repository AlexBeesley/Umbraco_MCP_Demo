# Cloudflare Worker for the public hosted Umbraco MCP server.
#
# Deployed by .github/workflows/deploy-mcp.yml, which creates the KV namespace if needed and sets the secrets.
# Local: copy .dev.vars.example to .dev.vars, then `npm run dev` (serves http://127.0.0.1:8787).

name = "umbraco-govuk-mcp"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat_v2"]

# Lets wrangler resolve modules the Developer MCP loads dynamically (same as Umbraco's own worker).
find_additional_modules = true

# OAuth token storage. The deploy workflow replaces this id with the real namespace's.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "local-oauth-kv"

# One Durable Object per MCP session.
[durable_objects]
bindings = [
  { name = "MCP_AGENT", class_name = "UmbracoMcpAgent" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UmbracoMcpAgent"]

# Admin-tier tool limits for the public demo. Umbraco enforces each user's permissions either way
# (the demo account gets 403 on publish/delete); hiding these stops the AI trying them.
# The hosted server doesn't hide tools by user permission the way the local server does.
[vars]
UMBRACO_EXCLUDE_SLICES = "delete,recycle-bin,publish,move,copy,sort,permissions,public-access,domains,notifications"
UMBRACO_EXCLUDE_TOOLS = "create-document-type,update-document-type,copy-document-type,move-document-type,delete-document-type,create-element-type,create-document-type-folder,update-document-type-folder,delete-document-type-folder"
